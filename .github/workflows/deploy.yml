name: Deploy to AWS (staging)

# Every merge to main: build the Docker image, push it to ECR, roll it out on
# ECS with zero downtime. A release that fails health checks rolls back.
# AWS access is via OIDC — no AWS keys are stored in GitHub.
#
# Repository → Settings → Secrets and variables → Actions → Variables:
#   AWS_DEPLOY_ROLE_ARN            (output of infra/terraform/bootstrap)
#   NEXT_PUBLIC_SUPABASE_URL       (new Supabase project URL — public value)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  (new Supabase anon key — public value)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: agrifintech-app
  ECS_CLUSTER: agrifintech-staging
  ECS_SERVICE: agrifintech-app
  TASK_FAMILY: agrifintech-staging-app
  CONTAINER: app

jobs:
  deploy:
    # Stays switched off until AWS is set up.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER }}
          image: ${{ steps.image.outputs.image }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
