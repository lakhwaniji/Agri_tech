<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AyaOne</title>
<style>
  html,body{margin:0;height:100%;background:#10221A;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;box-sizing:border-box;text-align:center}
  svg{width:96px;height:96px}
  .l{transform-box:view-box;transform-origin:36px 21px;animation:sway 4s ease-in-out infinite}
  .r{animation-direction:reverse}
  @keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
  h1{margin:0;font-size:22px}
  p{margin:0;color:#C9D9C3;font-size:15px;line-height:1.5;max-width:300px}
  button{font:inherit;font-weight:600;font-size:16px;min-height:52px;padding:0 32px;border:0;border-radius:999px;background:#6FA83C;color:#fff}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="43" r="22" fill="none" stroke="#fff" stroke-width="9"/><path class="l r" d="M36 21C36 9 46 2 59 2C59 15 50 21 36 21Z" fill="#B5DB7A"/><path class="l" d="M36 21C35 13 28 8 17 8C17 16 24 21 36 21Z" fill="#B5DB7A"/></svg>
  <h1 id="t">No internet connection</h1>
  <p id="b">AyaOne needs the internet. Check your mobile data or Wi-Fi and try again.</p>
  <button type="button" id="retry">Try again</button>
</main>
<script>
  var hi = (navigator.language || "").indexOf("hi") === 0;
  if (hi) {
    document.getElementById("t").textContent = "इंटरनेट कनेक्शन नहीं है";
    document.getElementById("b").textContent = "AyaOne को इंटरनेट चाहिए। मोबाइल डेटा या वाई-फ़ाई जांचें और फिर कोशिश करें।";
    document.getElementById("retry").textContent = "फिर कोशिश करें";
  }
  document.getElementById("retry").onclick = function () { window.location.href = "https://app.ayaone.in/login"; };
  window.addEventListener("online", function () { window.location.href = "https://app.ayaone.in/login"; });
</script>
</body>
</html>
